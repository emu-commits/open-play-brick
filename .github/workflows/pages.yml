name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install clang and wasm-ld
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Check the pin header matches the netlist
        run: node tools/gen_pins.mjs --check
      - name: Build the firmware for the emulator
        run: sh tools/build_wasm.sh
      - name: Run the firmware against the chip models
        run: node test/run.mjs
      - name: Build the catalogue image for real hardware
        run: node tools/build_catalog.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
